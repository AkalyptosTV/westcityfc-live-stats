<!doctype html>
<html lang="el"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>West City FC — Live Match Stats</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0d11;color:#fff;font-family:Arial,Helvetica,sans-serif}body{padding:12px}.wrap{max-width:560px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.title{font-weight:800;font-size:18px}.status{font-size:12px;padding:5px 9px;border-radius:99px;background:#7b1d1d}.status.ok{background:#176b38}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:#15181e;border:1px solid #2d323a;border-radius:16px;padding:14px}.team{text-align:center;font-weight:800;font-size:18px}.scoreNum{font-size:38px;font-weight:900;white-space:nowrap}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid #aaa}
.timer{text-align:center;margin:10px 0;font-size:28px;font-weight:900}.timer small{display:block;font-size:11px;font-weight:600;opacity:.65}
.stats{display:grid;grid-template-columns:1fr auto 1fr;background:#15181e;border:1px solid #2d323a;border-radius:16px;overflow:hidden}.st{padding:11px 8px;border-top:1px solid #252a31;text-align:center;font-weight:800}.label{padding:11px 4px;text-align:center;color:#aeb5c0;font-size:12px;border-top:1px solid #252a31}.bigstat{font-size:18px}
.poss{margin-top:10px;background:#15181e;border:1px solid #2d323a;border-radius:16px;padding:13px}.posrow{display:flex;justify-content:space-between;font-weight:900;font-size:20px}.bar{height:9px;background:#2b3038;border-radius:99px;overflow:hidden;margin:9px 0}.fill{height:100%;background:#fff}.halves{font-size:11px;color:#aeb5c0;line-height:1.8}
.events{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.ecol{background:#15181e;border:1px solid #2d323a;border-radius:16px;padding:10px;min-height:90px}.ename{font-size:12px;color:#aeb5c0;margin-bottom:7px;font-weight:800}.ev{font-size:13px;font-weight:800;padding:5px 0;border-bottom:1px solid #252a31}.empty{opacity:.4;font-size:12px}.note{text-align:center;color:#727985;font-size:10px;margin-top:10px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
</head><body><div class="wrap">
<div class="top"><div class="title">📊 LIVE MATCH STATS</div><div id="status" class="status">ΣΥΝΔΕΣΗ...</div></div>
<div class="score"><div class="team"><span id="ldot" class="dot"></span><span id="lname">WEST</span></div><div class="scoreNum"><span id="lscore">0</span> - <span id="rscore">0</span></div><div class="team"><span id="rdot" class="dot"></span><span id="rname">OSFP</span></div></div>
<div class="timer"><span id="clock">00:00</span><small id="half">1ο ΗΜΙΧΡΟΝΟ</small></div><div id="stats" class="stats"></div>
<div class="poss"><div class="posrow"><span id="lp">50.0%</span><span>ΚΑΤΟΧΗ</span><span id="rp">50.0%</span></div><div class="bar"><div id="bar" class="fill" style="width:50%"></div></div><div id="halves" class="halves"></div></div>
<div class="events"><div class="ecol"><div id="elname" class="ename">WEST</div><div id="lev"></div></div><div class="ecol"><div id="ername" class="ename">OSFP</div><div id="rev"></div></div></div>
<div class="note">LIVE • Firebase • 4G/5G</div></div>
<script>
const FIREBASE_CONFIG={"apiKey":"AIzaSyCxgw4XGzxQ8wRBqRPbnneVtbnUFYgegEE","authDomain":"westcityfc-live-stats.firebaseapp.com","databaseURL":"https://westcityfc-live-stats-default-rtdb.europe-west1.firebasedatabase.app","projectId":"westcityfc-live-stats","storageBucket":"westcityfc-live-stats.firebasestorage.app","messagingSenderId":"24596039470","appId":"1:24596039470:web:84e0b726c105b8826e9baf"};
let current=null;
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function color(v){let n=Number(v||0);return `rgb(${(n>>16)&255},${(n>>8)&255},${n&255})`}
function timerMs(t){if(!t)return 0;let b=Number(t.remaining_ms||0),lt=Number(t.last_tick_ms||0);if(!t.running||!lt)return b;let d=Date.now()-lt;return t.mode==='countup'?b+d:Math.max(0,b-d)}
function fmt(ms){let sec=Math.max(0,Math.floor(ms/1000));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function pct(a,b){let t=a+b;return t?100*a/t:50}
function icon(l){l=String(l||'');if(l.startsWith('ΓΚΟΛ'))return'⚽';if(l.startsWith('ΣΟΥΤ ΕΝΤΟΣ')||l.startsWith('ΣΟΥΤ ΣΤΗΝ ΕΣΤΙΑ'))return'🎯';if(l.startsWith('ΣΟΥΤ ΕΚΤΟΣ'))return'❌';if(l.startsWith('ΚΙΤΡΙΝΗ'))return'🟨';if(l.startsWith('ΚΟΚΚΙΝΗ'))return'🟥';if(l.startsWith('ΚΟΡΝΕΡ'))return'🚩';return''}
function player(l){let s=String(l||''),i=s.indexOf(' — ');return i>=0?s.slice(i+3):s}
function render(d){
 if(!d||!d.state)return;current=d;let s=d.state,sw=!!s.swap_sides,L=sw?'away':'home',R=sw?'home':'away',lf=s[L]||{},rf=s[R]||{},fs=s.custom_fields||[],field=n=>fs.find(f=>f.label===n)||{home:0,away:0};
 document.getElementById('lname').textContent=lf.title||'WEST';document.getElementById('rname').textContent=rf.title||'OSFP';document.getElementById('elname').textContent=lf.title||'WEST';document.getElementById('ername').textContent=rf.title||'OSFP';
 document.getElementById('ldot').style.background=color(lf.color);document.getElementById('rdot').style.background=color(rf.color);
 let g=field('ΓΚΟΛ');document.getElementById('lscore').textContent=g[L]??0;document.getElementById('rscore').textContent=g[R]??0;
 let rows=['ΓΚΟΛ','ΣΟΥΤ ΣΤΗΝ ΕΣΤΙΑ','ΣΟΥΤ ΕΚΤΟΣ ΣΤΟΧΟΥ','ΚΙΤΡΙΝΗ ΚΑΡΤΑ','ΚΟΚΚΙΝΗ ΚΑΡΤΑ','ΚΟΡΝΕΡ'];
 document.getElementById('stats').innerHTML=rows.map((n,i)=>`<div class="st ${i?'':'bigstat'}">${field(n)[L]??0}</div><div class="label">${esc(n)}</div><div class="st ${i?'':'bigstat'}">${field(n)[R]??0}</div>`).join('');
 let ts=s.timers||[],ti=(ts[1]?.visible&&!ts[0]?.visible)?1:0;document.getElementById('clock').textContent=fmt(timerMs(ts[ti]));document.getElementById('half').textContent=ti?'2ο ΗΜΙΧΡΟΝΟ':'1ο ΗΜΙΧΡΟΝΟ';
 let p=d.possessionSeconds||[{home:0,away:0},{home:0,away:0}],a=(p[0]?.[L]||0)+(p[1]?.[L]||0),b=(p[0]?.[R]||0)+(p[1]?.[R]||0),pp=pct(a,b);document.getElementById('lp').textContent=pp.toFixed(1)+'%';document.getElementById('rp').textContent=(100-pp).toFixed(1)+'%';document.getElementById('bar').style.width=pp+'%';
 let p1=pct(p[0]?.[L]||0,p[0]?.[R]||0),p2=pct(p[1]?.[L]||0,p[1]?.[R]||0);document.getElementById('halves').innerHTML=`1ο: ${lf.title||'WEST'} ${p1.toFixed(1)}% — ${rf.title||'OSFP'} ${(100-p1).toFixed(1)}%<br>2ο: ${lf.title||'WEST'} ${p2.toFixed(1)}% — ${rf.title||'OSFP'} ${(100-p2).toFixed(1)}%`;
 let ev=d.events||[];function side(side){return ev.filter(e=>e.side===side).slice(0,8).map(e=>`<div class="ev">${esc(e.time||'')} ${icon(e.label)} ${esc(player(e.label))}</div>`).join('')||'<div class="empty">—</div>'}document.getElementById('lev').innerHTML=side(L);document.getElementById('rev').innerHTML=side(R);
 document.getElementById('status').textContent='LIVE';document.getElementById('status').className='status ok';
}
firebase.initializeApp(FIREBASE_CONFIG);
firebase.auth().signInAnonymously().then(()=>{firebase.database().ref('liveMatch').on('value',snap=>{let d=snap.val();if(d)render(d)},err=>{document.getElementById('status').textContent='OFFLINE — '+(err.code||'DB ERROR')+' — '+(err.message||'');document.getElementById('status').className='status'})}).catch(err=>{document.getElementById('status').textContent='OFFLINE — '+(err.code||'AUTH ERROR')+' — '+(err.message||err);document.getElementById('status').className='status'});
setInterval(()=>{if(current&&current.state){let ts=current.state.timers||[],i=(ts[1]?.visible&&!ts[0]?.visible)?1:0;document.getElementById('clock').textContent=fmt(timerMs(ts[i]));}},500);
</script></body></html>
